plugins {
    id 'groovy'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'

    // NOWOŚĆ: Analiza statyczna dla Groovy
    id 'codenarc'

    // NOWOŚĆ: Raport pokrycia testami
    id 'jacoco'

    // Budowanie obrazu Dockerowego aplikacji za pomocą Jib
    id 'com.google.cloud.tools.jib' version '3.4.4'
    id 'org.jetbrains.kotlin.jvm'

}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// ─────────────────────────────────────────────────────────────────────────────
// Spring Boot 3.4.5 → Hibernate ORM 6.6.x
// HHH-17024 (ClassCastException przy @Audited + @ElementCollection) jest
// naprawiony w Hibernate 6.5+ / Spring Boot 3.3+.
// TransactionEntity może teraz mieć @Audited + @NotAudited na tags.
// ─────────────────────────────────────────────────────────────────────────────

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter'

    // Groovy (wykluczamy groovy-test-junit5, bo koliduje z silnikiem Spock)
    implementation('org.apache.groovy:groovy-all:4.0.15') {
        exclude group: 'org.apache.groovy', module: 'groovy-test'
        exclude group: 'org.apache.groovy', module: 'groovy-test-junit5'
        exclude group: 'org.apache.groovy', module: 'groovy-testng'
    }

    // Walidacja i narzędzia
    implementation 'org.codehaus.gpars:gpars:1.2.1'

    // Testy (wykluczamy junit-jupiter engine, aby SpockEngine był jedynym silnikiem)
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude module: 'junit-jupiter'
    }
    testImplementation 'org.spockframework:spock-spring:2.3-groovy-4.0'
    testImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // warstwa dostępu do danych (JPA)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Web Adapter (REST API)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Swagger / OpenAPI UI dla Spring Boot 3
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // Starter do walidacji danych wejściowych REST API
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Metryki, Healthchecki i monitoring dla produkcji
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Flyway - zarządzanie migracjami bazy danych
    implementation 'org.flywaydb:flyway-core'
    // Flyway 10.x wymaga jawnego modulu dla PostgreSQL (wylaczono z flyway-core w v10)
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Dodaj Awaitility do testów
    testImplementation('org.awaitility:awaitility-groovy:4.2.0') {
        exclude group: 'org.codehaus.groovy', module: 'groovy'
    }

    // Lab50--AOP--Aspect-Oriented-Programming
    // implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Lab52--Wzorzec-Circuit-Breaker--Bezpieczeństwo-w-Mikrousługach
    // Dedykowany starter Resilience4j dla Spring Boot 3
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.3.0'
    // WYMAGANE! Bez AOP adnotacja @CircuitBreaker nie zostanie wykryta przez Springa
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // WireMock do symulowania zewnętrznych serwerów REST API
    testImplementation 'org.springframework.cloud:spring-cloud-contract-wiremock:4.2.1'

    // UWAGA: Testcontainers docker-java nie jest kompatybilny z Docker Desktop 4.67+ (API 1.54)
    // Zamiast Testcontainers używamy Docker CLI bezpośrednio w BaseIntegrationSpec.
    // Konfiguracja PostgreSQL jest w BaseIntegrationSpec — kontener uruchamiany przez 'docker run'.

    // Sterownik JDBC PostgreSQL — wymagany do połączenia z PostgreSQL
    implementation 'org.postgresql:postgresql'

    // Lab63--Projekt-Minibank--Spring-Security-6-i-JWT
    // --- SECURITY & JWT ---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'

    // Biblioteki do generowania i weryfikacji tokenów JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // Lab88 - Hibernate Envers - wersjonowanie danych
    implementation 'org.hibernate.orm:hibernate-envers'

    // Lab89 - Spring Batch - Przetwarzanie Wsadowe (Miesięczne Rozliczenia)
    implementation 'org.springframework.boot:spring-boot-starter-batch'

    // Lab92--Spring Retry and Idempotency -- Bezpieczeństwo operacji
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'
}

test {
    useJUnitPlatform()

    // Jeden worker JVM na raz:
    // - w trybie 'tc' każdy fork chce zbindować port 15432 — dwa forki = konflikt portów
    // - w trybie 'local-pg' dwa forki rasowałyby na tej samej bazie
    // Retry w doTruncateDatabase obsługuje deadlocki wewnątrz jednego JVM (async eventy).
    maxParallelForks = 1

    // Przekazuje -Dlocal.pg=true z CLI do testu JVM
    // Użycie: ./gradlew test --tests "..." -Dlocal.pg=true
    systemProperty 'local.pg', System.getProperty('local.pg')
    // Przekazujemy również -Denable.flyway=true aby można było tymczasowo włączyć Flyway w testach
    systemProperty 'enable.flyway', System.getProperty('enable.flyway')

    // To każe Gradle wypisywać wszystko na ekran
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showStandardStreams = true
        exceptionFormat = 'full'
        showCauses = true
        showExceptions = true
    }
}

tasks.register('runSmartFinDb', JavaExec) {
    group = 'application'
    description = 'Uruchamia Smart-Fin-Analyzer z bazą danych (Spring Boot)'

    // Wskazujemy NOWĄ klasę
    mainClass.set('pl.edu.praktyki.SmartFinDbApp')
    classpath = sourceSets.main.runtimeClasspath

    // Wymuszenie Java 17
    def toolchainService = project.extensions.getByType(JavaToolchainService)
    javaLauncher.set(toolchainService.launcherFor(java.toolchain))

    if (project.hasProperty('appArgs')) {
        args(project.getProperty('appArgs').split('\\s+'))
    }
}

codenarc {
    toolVersion = '3.3.0'
    // Jeśli true, błąd stylu zatrzyma build. Ustawiamy false, żeby najpierw zobaczyć raport.
    ignoreFailures = true
    configFile = file("config/codenarc/codenarc.groovy") // Zaraz stworzymy ten plik
}

// Konfiguracja raportu JaCoCo
jacocoTestReport {
    dependsOn test // Raport generuje się po testach
    reports {
        xml.required = true
        html.required = true
    }
}

jib {
    to {
        image = 'smart-fin-analyzer:latest' // Nazwa twojego obrazu
    }
    container {
        // Wskazujemy główną klasę (tę z bazą danych)
        mainClass = 'pl.edu.praktyki.SmartFinDbApp'
        creationTime = 'USE_CURRENT_TIMESTAMP'
    }
}



// Zadanie pomocnicze: uruchamia Flyway (używa env vars: FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD)
tasks.register('runFlywayLocal', JavaExec) {
    group = 'database'
    description = 'Uruchamia migracje Flyway używając zmiennych środowiskowych FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD'
    mainClass.set('tools.RunFlyway')
    classpath = sourceSets.main.runtimeClasspath

    // Wymuszenie Java 17 przez toolchain (jak w innych zadaniach JavaExec)
    def toolchainService = project.extensions.getByType(JavaToolchainService)
    // toolchain to konfiguracja Java w sekcji java { toolchain { ... } }, a launcherFor() zwraca odpowiednią implementację JavaLauncher dla tej konfiguracji.
    javaLauncher.set(toolchainService.launcherFor(java.toolchain))
}



// Zadanie do uruchamiania lokalnego mock serwera dokumentów (WireMock) do testów curl.
// Użycie: ./gradlew runDocumentMockServer -DdocMockPort=8089 -DdocMockScenarios=src/test/resources/mock/document-scenarios.json
tasks.register('runDocumentMockServer', JavaExec) {
    group = 'verification'
    description = 'Uruchamia mockowany serwer dokumentów (WireMock) do lokalnych testów curl.'

    mainClass.set('pl.edu.praktyki.support.mock.DocumentApiMockServerRunner')
    classpath = sourceSets.test.runtimeClasspath

    if (project.hasProperty('docMockPort')) {
        systemProperty 'doc.mock.port', project.getProperty('docMockPort')
    }
    if (project.hasProperty('docMockScenarios')) {
        systemProperty 'doc.mock.scenarios', project.getProperty('docMockScenarios')
    }

    def toolchainService = project.extensions.getByType(JavaToolchainService)
    javaLauncher.set(toolchainService.launcherFor(java.toolchain))
}



// Zadanie do uruchamiania tylko testów związanych z DocumentProviderMockServerSpec, z osobnym katalogiem wyników,
// aby uniknąć konfliktów z domyślnym katalogiem test-results.
// Uruchomienie: ./gradlew.bat documentMockTest
// co się stanie jak uruchomię to zadanie?
// Uruchomi tylko testy z DocumentProviderMockServerSpec, a wyniki będą w build/test-results/documentMock/ i build/reports/tests/documentMock/

tasks.register('documentMockTest', Test) {
    group = 'verification'
    description = 'Uruchamia tylko DocumentProviderMockServerSpec z osobnym katalogiem wyników.'

    useJUnitPlatform()
    include '**/DocumentProviderMockServerSpec.*'

    // Separate binary results to avoid collisions with locked default test output.bin
    binaryResultsDirectory.set(layout.buildDirectory.dir('test-results/documentMock/binary'))
    reports.junitXml.outputLocation.set(layout.buildDirectory.dir('test-results/documentMock/xml'))
    reports.html.outputLocation.set(layout.buildDirectory.dir('reports/tests/documentMock'))

    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showStandardStreams = true
        exceptionFormat = 'full'
        showCauses = true
        showExceptions = true
    }
}


configurations.all {
    resolutionStrategy {
        // Wymuszamy, aby każda biblioteka używała Groovy 4.0.16
        force 'org.apache.groovy:groovy:4.0.16'
        force 'org.apache.groovy:groovy-xml:4.0.16'
        force 'org.apache.groovy:groovy-json:4.0.16'
        force 'org.apache.groovy:groovy-sql:4.0.16'
    }
}
